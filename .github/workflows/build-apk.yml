name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android Licenses
        run: |
          yes | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Build Debug APK
        run: |
          chmod +x $(find . -name "gradlew" -type f 2>/dev/null) || true
          echo "Project structure:"
          ls -la
          find . -maxdepth 4 -name "settings.gradle*" | head -10
          if [ -f "battery-doctor/battery-doctor/gradlew" ]; then
            cd battery-doctor/battery-doctor && ./gradlew assembleDebug --no-daemon
          elif [ -f "battery-doctor/gradlew" ]; then
            cd battery-doctor && ./gradlew assembleDebug --no-daemon
          elif [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            if [ -d "battery-doctor/battery-doctor" ]; then cd battery-doctor/battery-doctor; else if [ -d "battery-doctor" ]; then cd battery-doctor; fi; fi
            gradle assembleDebug --no-daemon
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Battery-Doctor-APK
          path: "**/build/outputs/apk/debug/*.apk"
